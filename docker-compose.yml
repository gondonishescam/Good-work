# All app services share one SQLite database and upload dir on the `data` volume.
# `environment` overrides .env, so a local DB_PATH there can't split them apart.
x-app: &app
  build: .
  env_file: .env
  environment: &app-env
    DB_PATH: /data/press1.db
    UPLOAD_DIR: /data/uploads
  volumes: [data:/data]
  restart: unless-stopped

services:
  web:  # web panel + Plivo webhooks, reached only through caddy
    <<: *app
    command: gunicorn -c gunicorn.conf.py press1.app:app
    environment:
      <<: *app-env
      TRUST_PROXY: "1"
    expose: ["8000"]
  runner:  # the only process that places campaign calls
    <<: *app
    command: python -m press1.runner
  bot:
    <<: *app
    command: python -m press1.bot
  caddy:
    image: caddy:2
    env_file: .env
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped

volumes:
  data:
  caddy_data:
  caddy_config:
